<main>

<script>
const SUPABASE_URL = "https://vlrygdrzwnjxkbarjcun.supabase.co";
const SUPABASE_KEY = "sb_publishable_RG-WBKfSxNk7oKr0DircGQ_d1TRwIQb";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
window.supabaseClient = supabaseClient;
const $=id=>document.getElementById(id);
const KEY="kuzey-quai-bookings-v1";
let bookings=[];
try{bookings=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){bookings=[]}
$("date").value=new Date().toLocaleDateString("en-CA");
function save(){localStorage.setItem(KEY,JSON.stringify(bookings));render()}
$("bookingForm").addEventListener("submit",e=>{
e.preventDefault();
bookings.push({
id:Date.now(),date:$("date").value,time:$("time").value,
customer:$("customer").value.trim(),carrier:$("carrier").value.trim(),
plate:$("plate").value.trim(),pallets:$("pallets").value,
quai:$("quai").value,status:$("status").value,notes:$("notes").value.trim()
});
const b=bookings[bookings.length-1];
window.supabaseClient.from("rendez_vous").insert({
  date:b.date,
  time:b.time,
  customer:b.customer,
  carrier:b.carrier,
  plate:b.plate,
  palettes:Number(b.pallets),
  quai:b.quai,
  status:b.status,
  notes:b.notes
}).then(({error})=>{
  if(error) alert("Erreur Supabase : "+error.message);
});
save();
e.target.reset();
$("date").value=new Date().toLocaleDateString("en-CA");
$("pallets").value=0;
});
function render(){
const q=$("search").value.toLowerCase();
const d=$("filterDate").value, quai=$("filterQuai").value;
const items=bookings.filter(b=>
(b.customer+" "+b.carrier+" "+b.plate).toLowerCase().includes(q)&&
(!d||b.date===d)&&(!quai||b.quai===quai)
).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
$("list").innerHTML="";
if(!items.length){$("list").innerHTML='<div class="empty">Aucun rendez-vous pour le moment.</div>';return}
items.forEach(b=>{
const el=document.createElement("div");el.className="item";
const title=document.createElement("strong");title.textContent=b.customer;
const info=document.createElement("p");
info.textContent=b.date+" à "+b.time+" · "+b.quai+" · "+b.pallets+" palettes";
const extra=document.createElement("p");
extra.textContent="Transporteur : "+(b.carrier||"—")+" | Plaque : "+(b.plate||"—");
const st=document.createElement("p");st.className="status";st.textContent=b.status;
el.append(title,info,extra,st);
if(b.notes){const n=document.createElement("p");n.textContent="Note : "+b.notes;el.append(n)}
const actions=document.createElement("div");actions.className="actions";
const edit=document.createElement("button");edit.className="secondary";edit.textContent="Modifier";
edit.onclick=()=>{
$("date").value=b.date;$("time").value=b.time;$("customer").value=b.customer;
$("carrier").value=b.carrier;$("plate").value=b.plate;$("pallets").value=b.pallets;
$("quai").value=b.quai;$("status").value=b.status;$("notes").value=b.notes;
bookings=bookings.filter(x=>x.id!==b.id);save();
window.scrollTo({top:0,behavior:"smooth"});
};
const del=document.createElement("button");del.className="delete";del.textContent="Supprimer";
del.onclick=()=>{if(confirm("Supprimer ce rendez-vous ?")){bookings=bookings.filter(x=>x.id!==b.id);save()}};
actions.append(edit,del);el.append(actions);$("list").append(el);
});
}
["search","filterDate","filterQuai"].forEach(id=>$(id).addEventListener(id==="search"?"input":"change",render));
$("export").onclick=()=>{
const cols=["date","time","customer","carrier","plate","pallets","quai","status","notes"];
const csv=[cols.join(";"),...bookings.map(b=>cols.map(k=>'"'+String(b[k]??"").replace(/"/g,'""')+'"').join(";"))].join("\r\n");
const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
const url=URL.createObjectURL(blob),a=document.createElement("a");
a.href=url;a.download="kuzey-quai-rendez-vous.csv";a.click();URL.revokeObjectURL(url);
};
render();
</script>

<script>
(function () {
  const client = window.supabaseClient;

  const loginPanel = document.getElementById("loginPanel");
  const loginForm = document.getElementById("loginForm");
  const loginButton = document.getElementById("loginButton");
  const loginMessage = document.getElementById("loginMessage");
  const forgotButton = document.getElementById("forgotPasswordButton");

  const resetPanel = document.getElementById("passwordResetPanel");
  const resetForm = document.getElementById("passwordResetForm");
  const resetMessage = document.getElementById("resetMessage");

  if (!client || !client.auth) {
    loginMessage.textContent =
      "Erreur de connexion au service. Rechargez la page.";
    return;
  }

  function showResetPanel() {
    loginPanel.style.display = "none";
    resetPanel.style.display = "flex";
  }

  function showLoginPanel(message) {
    resetPanel.style.display = "none";
    loginPanel.style.display = "flex";
    loginMessage.textContent = message || "";
  }

  const hashParams = new URLSearchParams(
    window.location.hash.substring(1)
  );
  const queryParams = new URLSearchParams(
    window.location.search
  );

  const isRecovery =
    hashParams.get("type") === "recovery" ||
    queryParams.get("type") === "recovery";

  if (isRecovery) {
    showResetPanel();
  }

  client.auth.onAuthStateChange(function (event, session) {
    if (event === "PASSWORD_RECOVERY") {
      showResetPanel();
    }

    if (event === "SIGNED_IN" && session && !isRecovery) {
      loginPanel.style.display = "none";
      resetPanel.style.display = "none";
    }
  });

  client.auth.getSession().then(function (result) {
    if (result.error) return;

    if (result.data.session && !isRecovery) {
      loginPanel.style.display = "none";
    }
  });

  loginForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    loginButton.disabled = true;
    loginButton.textContent = "Connexion...";
    loginMessage.textContent = "";

    try {
      const result = await client.auth.signInWithPassword({
        email: document.getElementById("loginEmail").value.trim(),
        password: document.getElementById("loginPassword").value
      });

      if (result.error) {
        loginMessage.textContent =
          "Échec de connexion. Vérifiez l’e-mail et le mot de passe.";
      } else {
        loginPanel.style.display = "none";
        resetPanel.style.display = "none";
      }
    } catch (error) {
      loginMessage.textContent = "Erreur : " + error.message;
    } finally {
      loginButton.disabled = false;
      loginButton.textContent = "Se connecter";
    }
  });

  forgotButton.addEventListener("click", async function () {
    const email = document.getElementById("loginEmail").value.trim();

    if (!email) {
      loginMessage.textContent =
        "Saisissez d'abord votre adresse e-mail.";
      document.getElementById("loginEmail").focus();
      return;
    }

    forgotButton.disabled = true;
    loginMessage.textContent = "Envoi en cours...";

    try {
      const result = await client.auth.resetPasswordForEmail(email, {
        redirectTo: "https://ozgurkuzey-cyber.github.io/kuzey-quai/"
      });

      if (result.error) {
        loginMessage.textContent = "Erreur : " + result.error.message;
      } else {
        loginMessage.textContent =
          "Si cette adresse est enregistrée, un e-mail de réinitialisation sera envoyé. Vérifiez aussi vos courriers indésirables.";
      }
    } catch (error) {
      loginMessage.textContent = "Erreur : " + error.message;
    } finally {
      forgotButton.disabled = false;
    }
  });

  resetForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    const password = document.getElementById("newPassword").value;
    const saveButton = resetForm.querySelector('button[type="submit"]');

    saveButton.disabled = true;
    resetMessage.textContent = "Enregistrement en cours...";

    try {
      const result = await client.auth.updateUser({
        password: password
      });

      if (result.error) {
        resetMessage.textContent = "Erreur : " + result.error.message;
        return;
      }

      await client.auth.signOut();

      window.history.replaceState(
        null,
        "",
        window.location.pathname
      );

      showLoginPanel(
        "Mot de passe modifié. Connectez-vous avec votre nouveau mot de passe."
      );
    } catch (error) {
      resetMessage.textContent = "Erreur : " + error.message;
    } finally {
      saveButton.disabled = false;
    }
  });
})();
</script>
